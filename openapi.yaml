            schema:
              $ref: "#/components/schemas/Bookmark"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bookmark"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      parameters:
      - name: folderId
        in: query
        schema:
          type: string
      security:
      - SecurityScheme:
        - AUTHENTICATED
