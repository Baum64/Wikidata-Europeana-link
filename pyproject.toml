[project]
name = "glamsync"
version = "0.1.0"
description = "Abgleich von Kulturerbe-Einrichtungen zwischen Europeana, DDB und Wikidata (erzeugt QuickStatements zur manuellen Prüfung)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["requests>=2.31"]

[project.urls]
Repository = "https://github.com/Baum64/Wikidata-Europeana-link"
Issues = "https://github.com/Baum64/Wikidata-Europeana-link/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
glamsync = "glamsync.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["glamsync", "glamsync.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
